# Closure Call operating-posture policy.
#
# Read by rules/engine.py. Each rule fires when ANY clause under condition.any matches.
# When several rules fire, the most restrictive posture wins:
#   closure > telework > early_dismissal > delayed_arrival > normal
#
# Clause types:
#   alert          an active NWS alert covering the facility. Filters (all optional):
#                  events, severity, urgency. window: operating_hours | operating_day
#   forecast_gust  forecast gust in the commute window. min_mph (inclusive), below_mph (exclusive)
#
# Windows (facility local time, on the operating date):
#   commute_window   = open_time - 2h  .. open_time
#   operating_hours  = open_time       .. close_time
#   departure_window = close_time      .. close_time + 2h
#   operating_day    = commute start   .. departure end
#
# Source definitions are verified; posture mappings remain this prototype's facility policy.
version: "1.0.4"
change_log:
  - version: "1.0.4"
    date: "2026-10-11"
    changes: "Flood rules cite national NWS definitions and the facility's confirmed local office. Outside EAX, numeric wind cutoffs are facility choices; national Directive 10-515 is the fallback reference. Non-applicable coverage is excluded from confidence."
  - version: "1.0.3"
    date: "2026-10-11"
    changes: "Added supplementary AirNow AQI rules: supervisor accommodation suggestions at 101–150, telework at 151–200, closure at 201+. EPA categories are verified; these posture mappings are facility choices."
  - version: "1.0.2"
    date: "2026-10-11"
    changes: "Added verified Winter Storm Warning, Ice Storm Warning and Winter Weather Advisory definitions with explicit facility posture mappings; EAX numeric criteria remain local references, not national thresholds."
  - version: "1.0.1"
    date: "2026-10-11"
    changes: "Added facility-only verified forecaster confidence context; all posture thresholds and lead-time caps unchanged."
  - version: "1.0.0"
    date: "2026-10-11"
    changes: "Verified EAX wind bands (unchanged), CAP fields, KCDM7 stages and OPM obligations; distinguished facility decisions and FEB coordination from federal hazard definitions. Added sustained-wind checks."
commute_window_hours: 2
departure_window_hours: 2

rules:
  - id: air_quality_sensitive
    description: Unhealthy for Sensitive Groups during operating hours; supervisor accommodation suggestions, no posture change
    hazard: air_quality
    condition:
      any:
        - type: air_quality
          min_aqi: 101
          below_aqi: 151
          window: operating_hours
    posture: normal
    group: facility
    verified: true
    citation: &epa_aqi
      title: Air Quality Index (AQI) Basics
      publisher: U.S. EPA / AirNow
      url: https://www.airnow.gov/aqi/aqi-basics/
      section_or_page: "AQI Basics for Ozone and Particle Pollution: six-category table"
      retrieved_at: "2026-10-11T05:40:00Z"
    justification: >
      EPA defines AQI 101–150 as Unhealthy for Sensitive Groups. Facility policy v1.0
      keeps the operating posture unchanged while supervisors offer unscheduled telework
      to scheduled onsite employees with an accommodation on file; no medical details are disclosed.

  - id: air_quality_telework
    description: Unhealthy air quality during operating hours
    hazard: air_quality
    condition:
      any:
        - type: air_quality
          min_aqi: 151
          below_aqi: 201
          window: operating_hours
    posture: telework
    group: facility
    verified: true
    citation: *epa_aqi
    justification: >
      EPA defines AQI 151–200 as Unhealthy, with possible effects on the general public.
      Facility policy v1.0 maps this category to telework to reduce onsite exposure;
      emergency duties and employee eligibility remain governed by agency instructions.

  - id: air_quality_closure
    description: Very Unhealthy or Hazardous air quality, current or forecast for the target day
    hazard: air_quality
    condition:
      any:
        - type: air_quality
          min_aqi: 201
          window: operating_day
    posture: closure
    group: facility
    verified: true
    citation: *epa_aqi
    justification: >
      EPA defines AQI 201–300 as Very Unhealthy and 301+ as Hazardous. Facility policy v1.0
      closes onsite non-emergency work at 201 or higher; emergency staff follow agency instructions.
      The highest fresh current or target-day forecast AQI applies; this is not an EPA closure mandate.

  - id: extreme_immediate_alert
    description: Active NWS alert with severity Extreme and urgency Immediate during operating hours
    hazard: any
    condition:
      any:
        - type: alert
          severity: [Extreme]
          urgency: [Immediate]
          window: operating_hours
    posture: closure
    group: federal
    verified: true
    citation:
      title: Common Alerting Protocol Version 1.2
      publisher: OASIS
      url: https://docs.oasis-open.org/emergency/cap/v1.2/CAP-v1.2-os.html
      section_or_page: "3.2.2 info: severity, urgency, certainty"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: >
      Extreme describes an extraordinary threat and Immediate requires action now.
      Closure during operating hours is Facility policy v1.0, not a CAP requirement;
      emergency personnel follow agency instructions and shelter guidance.

  - id: high_wind
    description: High Wind Warning active, commute gusts >= 58 mph, or sustained wind >= 40 mph for one hour
    hazard: wind
    condition:
      any:
        - type: alert
          events: [High Wind Warning, Extreme Wind Warning]
          window: operating_day
        - type: forecast_gust
          min_mph: 58
          window: commute
        - type: forecast_wind
          min_mph: 40
          duration_minutes: 60
          window: commute
    posture: closure
    group: federal
    verified: true
    citation: &eax
      title: WFO Kansas City Watch/Warning/Advisory Criteria
      publisher: NWS Kansas City/Pleasant Hill (EAX)
      url: https://www.weather.gov/eax/eaxwwacriteria
      section_or_page: "Wind: High Wind Warning and Wind Advisory; Flooding; Convective"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: >
      EAX uses non-convective gusts at least 58 mph or sustained winds at least 40 mph for
      one hour. Facility policy v1.0 maps the warning or equivalent commute forecast to
      closure to reduce travel exposure; NWS does not order a facility closure.

  - id: wind_advisory
    description: Wind Advisory active, commute gusts 46-57 mph, or sustained wind 31-39 mph for one hour
    hazard: wind
    condition:
      any:
        - type: alert
          events: [Wind Advisory]
          window: operating_day
        - type: forecast_gust
          min_mph: 46
          below_mph: 58
          window: commute
        - type: forecast_wind
          min_mph: 31
          below_mph: 40
          duration_minutes: 60
          window: commute
    posture: delayed_arrival
    group: federal
    verified: true
    citation: *eax
    justification: >
      EAX specifies non-convective gusts 46–57 mph or sustained winds 31–39 mph for one hour;
      continuous forecasts use an upper bound below the warning threshold.
      Delayed arrival is Facility policy v1.0 and requires a manager to verify a safer travel window.

  - id: flood
    description: Flash Flood Warning or Flood Warning covering the facility
    hazard: flood
    condition:
      any:
        - type: alert
          events: [Flash Flood Warning, Flood Warning, Flash Flood Emergency]
          window: operating_day
    posture: telework
    group: federal
    verified: true
    citation:
      title: NWS Flood and Flash Flood Warning definitions
      publisher: NOAA National Weather Service
      url: https://www.weather.gov/safety/flood-watch-warning
      section_or_page: "Flood Warning; Flash Flood Warning"
      retrieved_at: "2026-10-11T06:59:35Z"
    justification: >
      NWS flood warnings identify imminent or occurring flooding. Facility policy v1.0 chooses
      telework to reduce travel exposure; eligibility and emergency duties remain subject to
      agency authorization, and a warning alone does not prove the building is flooded.

  - id: convective
    description: Severe Thunderstorm Warning or Tornado Warning during operating hours
    hazard: convective
    condition:
      any:
        - type: alert
          events: [Severe Thunderstorm Warning, Tornado Warning]
          window: operating_hours
    # Starts after opening: dismiss early. Starts at or before opening: delay arrival.
    posture: early_dismissal
    posture_if_onset_before_open: delayed_arrival
    group: federal
    verified: true
    citation: *eax
    justification: >
      EAX warnings describe imminent or ongoing severe thunderstorms or tornadoes.
      Facility policy v1.0 delays arrival before opening and proposes early departure after
      opening only when safe; an active warning requires shelter guidance, not immediate travel.

  - id: winter_storm
    description: Winter Storm Warning covering the facility during the operating day
    hazard: winter
    condition:
      any:
        - type: alert
          events: [Winter Storm Warning]
          window: operating_day
    posture: closure
    group: federal
    verified: true
    citation: &winter_definitions
      title: Winter Weather Warnings, Watches and Advisories
      publisher: NOAA National Weather Service
      url: https://www.weather.gov/safety/winter-ww
      section_or_page: "Warnings: Winter Storm Warning and Ice Storm Warning; Advisories: Winter Weather Advisory"
      retrieved_at: "2026-10-11T05:11:55Z"
    justification: >
      NWS defines a Winter Storm Warning as significant snow, ice, sleet or blowing snow,
      with potentially difficult or impossible travel. Closure during the target operating
      day is our Facility policy v1.0 travel-safety choice, not an NWS closure instruction.
  - id: ice_storm
    description: Ice Storm Warning covering the facility during the operating day
    hazard: winter
    condition:
      any:
        - type: alert
          events: [Ice Storm Warning]
          window: operating_day
    posture: closure
    group: federal
    verified: true
    citation: *winter_definitions
    justification: >
      NWS describes dangerous or impossible travel and likely tree or power-line damage
      under an Ice Storm Warning. Our Facility policy v1.0 chooses closure; issuing-office
      criteria determine the warning, and EAX ice amounts are not imposed nationwide.
  - id: winter_advisory
    description: Winter Weather Advisory covering the facility during the operating day
    hazard: winter
    condition:
      any:
        - type: alert
          events: [Winter Weather Advisory]
          window: operating_day
    posture: delayed_arrival
    group: federal
    verified: true
    citation: *winter_definitions
    justification: >
      NWS advisories describe wintry conditions below warning criteria that can still
      complicate travel. Delayed arrival is our Facility policy v1.0 choice, subject to
      manager review of a safer window rather than an assumption that roads are clear.

# Local signals (agents/local). Facts are extracted by agents and validated in code; only these
# rules decide what they change. Nothing from local signals can lower the posture.
local_signals:
  citation: "Facility policy v1.0 (this system): access_route_closed and local_corroboration"
  closure_confidence: [high, medium]   # agent confidence needed for a road closure to count
  school_min_home_counties: 3          # school closures in this many employee home counties corroborate
  # Location: a closure counts only if its coordinates fall inside a facility access segment's
  # buffer (facility.access_routes, default 2 km) or an employee's commute corridor (home ->
  # facility line, 3 km). Items without coordinates are "uncertain" and never trigger.
  access_route_closed:
    some_routes_closed: delayed_arrival
    all_routes_closed: telework

# Reference-only entries are shown on Thresholds; they are not new automatic closure rules.
references:
  - id: eax_winter_criteria
    group: federal
    description: EAX local winter product criteria (KC only)
    condition: "Winter Storm Warning: snow at least 5 inches or sleet at least 0.5 inch, or impactful snow/freezing-rain combinations. Ice Storm Warning: planar ice at least 0.25 inch. Advisory: snow 1 to less than 5 inches or ice less than 0.25 inch, with forecaster discretion including black ice."
    posture: Reference only; use the issuing office's alert outside EAX
    verified: true
    citation:
      title: WFO EAX Weather Product Criteria — Winter and Freezing Rain
      publisher: NWS Kansas City/Pleasant Hill (EAX)
      url: https://www.weather.gov/eax/eaxwwacriteria2
      section_or_page: "Winter Storm Warning; Winter Weather Advisory; Ice Storm Warning"
      retrieved_at: "2026-10-11T05:11:55Z"
    justification: EAX publishes these local amounts and allows forecaster discretion based on impacts. National demo relocation uses actual warning categories from the local issuing office, not invented nationwide snow or ice thresholds.
  - id: nws_nonprecipitation
    group: federal
    description: National non-precipitation criteria
    condition: "Typical warning: sustained 40 mph for one hour or wind 58 mph; advisory sustained 30–39 mph or locally defined. EAX local criteria take precedence here."
    posture: Reference only
    verified: true
    citation:
      title: NWS Instruction 10-515 (May 16, 2025)
      publisher: NOAA National Weather Service
      url: https://www.weather.gov/media/directives/010_pdfs/pd01005015curr.pdf
      section_or_page: "6.2.3, tables on printed pages 6–7"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: The national directive explicitly allows local wind criteria. This system uses the opened EAX criteria rather than importing another forecast office's advisory band.
  - id: nws_cap
    group: federal
    description: NWS CAP alert field interpretation
    condition: "Urgency, severity and certainty describe response timing, impact and likelihood; Observed/Likely support confidence."
    posture: Reference only
    verified: true
    citation:
      title: NWS CAP v1.2 Documentation
      publisher: NOAA National Weather Service
      url: https://www.weather.gov/media/alert/CAP_v12_guide_05-16-2017.pdf
      section_or_page: "info block urgency/severity/certainty; services-web-alerts and services-web-api"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: NWS alerts implement CAP fields defined by OASIS. Treating uncertainty as a confidence reduction is a facility choice, not a CAP operating-status rule.
  - id: river_kcdm7
    group: federal
    description: Missouri River at Kansas City flood categories
    condition: "KCDM7 stage in feet: action 29; minor 32; moderate 35; major 49."
    values: {action: 29, minor: 32, moderate: 35, major: 49}
    posture: Reference only; check access and site impacts
    verified: true
    citation:
      title: NOAA NWPS gauge KCDM7
      publisher: NOAA National Water Prediction Service
      url: https://api.water.noaa.gov/nwps/v1/gauges/KCDM7
      section_or_page: "flood.stageUnits and flood.categories.{action,minor,moderate,major}.stage"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: These gauge-specific stages classify river flooding, not facility inundation. They prompt an access/site investigation and do not independently order closure.
  - id: operating_postures
    group: federal
    description: Operating-status names and employee obligations
    condition: "Open; delayed arrival; early departure; office closure; unscheduled telework. Emergency staff follow agency duties; telework-ready staff need agency authorization/agreements."
    posture: Reference only
    verified: true
    citation:
      title: Governmentwide Dismissal and Closure Procedures (December 2025)
      publisher: US Office of Personnel Management
      url: https://www.opm.gov/policy-data-oversight/pay-leave/reference-materials/handbooks/dcdismissal.pdf
      section_or_page: "II.B/E/G; III.A; IV.B (printed pages 2–6, 11–13, 18–30)"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: Our normal/early_dismissal/closure labels map to open/early departure/office closure. Telework is an authorized flexibility, not a separate OPM standard status, and DC announcements do not determine Kansas City agency status.
  - id: kc_feb
    group: coordination
    description: Kansas City Federal Executive Board coordination
    condition: "Manager should check agency/FEB coordination before deciding; no verified machine-readable status feed."
    posture: Manager reference only
    verified: true
    citation:
      title: Federal Executive Boards FY2019 Annual Report
      publisher: US Office of Personnel Management
      url: https://www.opm.gov/chcoc/transmittals/2020/attachments/federal-executive-board-2019-annual-report_0.pdf
      section_or_page: "Emergency Preparedness, Security and Safety; printed page 14"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: OPM documents Kansas City FEB participation in operating-status coordination and recommendations. This verifies the published role historically; the current FEB website was unavailable, so the manager must confirm current contacts and announcements with their agency.
  - id: access_route_closed
    group: facility
    description: Facility access-route closures
    condition: "Official state closure, source coordinates on its own route inside the access buffer, during the target commute: some routes closed → delay; all → telework."
    posture: delayed_arrival / telework
    verified: true
    citation: &facility_policy
      title: Facility policy v1.0 (this system)
      publisher: Closure Call prototype
      url: /thresholds#access_route_closed
      section_or_page: "docs/facility-policy.md; rules/local.py; geo.py"
      retrieved_at: "2026-10-11T02:11:09Z"
    justification: This facility choice reduces travel when access is obstructed. Approximate geocodes, ramp/lane restrictions and uncertain locations cannot trigger facility closure.
  - id: site_hazard_reported
    group: facility
    description: Unsafe site condition reported by facility operations
    condition: "Authenticated single-use response by facility_ops identifies unsafe site conditions for the target day's commute window."
    posture: delayed_arrival
    verified: true
    citation: *facility_policy
    justification: A time-scoped human report warrants a delay for manager review. It never reduces an existing posture and is displayed as human-reported evidence, not an official weather observation.
  - id: staffing_minimums
    group: facility
    description: Critical-function staffing minimums
    condition: "Facility roster sets minimum on-site coverage by function and posture; exposed, absent or unacknowledged staff do not satisfy coverage."
    posture: Staffing alert; manager selects call-ins
    verified: true
    citation: *facility_policy
    justification: Minimum coverage values belong to this synthetic facility roster. OPM does not prescribe these numbers; managers choose call-ins and check safe access.
  - id: lead_time_confidence
    group: facility
    description: Forecast lead-time confidence caps
    condition: "More than 24 hours to commute → at most medium; more than 48 hours → low. Near a gust threshold means within 5 mph."
    posture: Confidence only
    verified: true
    citation: *facility_policy
    justification: Longer-range forecasts and borderline values warrant conservative confidence. These 24/48-hour caps and 5-mph margin are facility choices, not NWS forecast accuracy guarantees.
  - id: calendar
    group: facility
    description: Operating calendar and evidence windows
    condition: "Default Mon–Fri excluding observed US federal holidays; commute starts 2 hours before opening; departure ends 2 hours after closing. Explicit dates and labelled demo workdays are allowed."
    posture: Target-day selection only
    verified: true
    citation: *facility_policy
    justification: The facility chooses its operating schedule and two-hour travel windows. Essential functions can have separate operating days and explicit employee shifts still govern recipient selection.
  - id: local_corroboration
    group: facility
    description: Local corroboration and missing evidence
    condition: "Schools in facility county or at least 3 home counties corroborate a fired weather rule; confidence can rise one level. Missing/stale/uncertain evidence lowers confidence; news never triggers a posture."
    posture: Confidence and manager-check notes only
    verified: true
    citation: *facility_policy
    justification: These corroboration thresholds belong to this prototype. Local context can support a weather finding without replacing official evidence or lowering the recommended posture.
  - id: forecaster_context
    group: facility
    description: Verified target-day forecaster context
    condition: "A verified AFD/HWO quote explicitly naming the target day and no significant hazards can raise confidence one level only when all required sources are current, within the 24/48-hour cap. A possible hazard adds a watch flag. EAX text applies only to EAX facilities."
    posture: Confidence context only; never a posture trigger
    verified: true
    citation: *facility_policy
    justification: This is a facility policy choice, not a federal confidence standard. Verified forecaster wording supplements current structured evidence, while long-range caps and deterministic posture thresholds remain authoritative.
